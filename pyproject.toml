[project]
name = "balanza-logigrain"
version = "0.1.0"
description = "Puesto de balanza de camiones integrado con la API Logigrain"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8", "pyserial>=3.5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# QPrinter dispara excepciones COM internas de Windows (0x80040155) que Qt maneja solo;
# el faulthandler de pytest las vuelca como si fueran fallas y ensucia la salida.
addopts = "-p no:faulthandler"
