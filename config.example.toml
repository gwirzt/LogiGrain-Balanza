# Copiar este archivo como config.toml y ajustar los valores de cada puesto.

puesto = "BALANZA-1"          # identifica la PC en tickets y envíos
carpeta_datos = "datos"       # base SQLite local y logs
peso_minimo_kg = 500          # no permite pesar por debajo de este valor (balanza vacía)

# Un bloque [[balanzas]] por cabezal: 1 o 2.
# El primero se muestra arriba a la izquierda (tecla F2), el segundo arriba a la derecha (tecla F3).
[[balanzas]]
nro = 1                       # número de balanza en LogiGrain (se envía como balanza_nro)
modo = "serie"                # "simulador" para probar sin cabezal | "serie" para el cabezal real
puerto = "COM3"
baudios = 9600
bits_datos = 8
paridad = "N"                 # N (ninguna), E (par), O (impar)
bits_parada = 1
protocolo = "generico"        # parser del indicador; se agrega uno por modelo de cabezal
division_kg = 20              # mínima unidad del indicador (el simulador pesa de a esta cantidad)
umbral_cero_kg = 100          # después de pesar queda en 0 hasta que el indicador baje a este valor
lecturas_estables = 5         # lecturas seguidas dentro de la tolerancia para considerar "estable"
tolerancia_kg = 20

# Segunda balanza (opcional): borrar este bloque si el puesto tiene un solo cabezal.
[[balanzas]]
nro = 2
modo = "serie"
puerto = "COM4"
baudios = 9600

[api]
modo = "http"                 # "mock" (datos de prueba) | "http" (API LogiGrain real)
url_base = "http://10.1.0.5:5173"
# port_id = 1                 # sin valor: el primer puerto asignado al usuario
enviar_pesos = true           # false = modo prueba, no registra pesos. No se permite true con simuladores.
timeout_s = 10
intervalo_sync_s = 30         # cada cuánto reintenta enviar pesajes pendientes
# El usuario y la contraseña se piden al abrir el programa (se completan con el archivo .env si existe:
# USUARIO_LOGIGRAIN=... y CONTRASENA_LOGIGRAIN=...)

[ticket]
impresora = ""                # vacío = impresora predeterminada de Windows
ancho_mm = 80                 # 80 para térmica de tickets, 210 para A4
alto_mm = 220
empresa = "Servicios Portuarios S.A."
vista_previa = true
